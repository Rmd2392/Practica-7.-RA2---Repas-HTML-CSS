<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pràctica 7 - HTML CSS</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
    
  <!-- Menú superior fijo -->
  <nav class="fixed-menu">
    <a href="#enlace1">Enllaç 1</a>
    <a href="#enlace2">Enllaç 2</a>
    <a href="#enlace3">Enllaç 3</a>
  </nav>

  <!-- CONTENEDOR AZUL (general) -->
  <div class="blue-box">
    
    <!-- CONTENEDOR MARRÓN (main-container) -->
    <main class="brown-box">
      <!-- CONTENEDOR ROSA (imagen) -->
      <article class="pink-box">
        <img src="img/html&css.jpg" alt="Imagen HTML y CSS" class="image" />
        <!-- CONTENEDOR ROSA (contenido) -->
        <div class="pink-content">
          <!-- CONTENEDOR VERDE (título noticia) -->
          <div class="green-box title">
            <h2>Títol de l'article</h2>
          </div>
          <!-- CONTENEDOR VERDE (texto noticia) -->
          <div class="green-box text">
            <p>
              Lorem ipsum dolor sit amet consectetur adipisicing elit. Possimus, harum repellat! Doloribus quas, porro dolorem aspernatur quidem qui hic officia ipsum molestiae ipsa alias enim temporibus ducimus, adipisci soluta expedita.
            </p>
          </div>
        </div>
      </article>
    </main>

    <!-- Menú lateral (verde) -->
    <aside class="green-sidebar">
      <button class="menu">Menu 1</button>
      <button class="menu">Menu 2</button>
    </aside>
  </div>

  <!-- Botón fijo inferior derecha -->
  <div class="fixed-bottom-right">
    Contáctanos
  </div>

</body>
</html>
